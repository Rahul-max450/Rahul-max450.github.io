<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Happy Birthday Rakshita ✨</title>

    <style>
        :root {
            --bg-dark: #0a0a0c;
            --neon-pink: #ff007f;
            --premium-gold: #d4af37;
            --electric-blue: #00f0ff;
            --text-light: #e2e8f0;
            --card-rgba: rgba(20, 20, 25, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stars-grid {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at top, rgba(255, 0, 127, 0.08), transparent 50%);
            z-index: 0;
        }

        .ambient-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle,
                    rgba(0, 240, 255, 0.08),
                    transparent 70%);
            filter: blur(80px);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            z-index: 2;
            text-align: center;
        }

        #loader-screen {
            background: rgba(15, 15, 20, 0.9);
            border: 1px solid var(--neon-pink);
            border-radius: 22px;
            padding: 40px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.25);
            text-align: left;
            backdrop-filter: blur(14px);
            transition: 0.8s;
        }

        .status-line {
            margin-bottom: 18px;
            font-size: 1rem;
            color: #d1d5db;
            letter-spacing: 1px;
        }

        .status-line span {
            color: var(--electric-blue);
        }

        .pulse-btn {
            margin-top: 30px;
            width: 100%;
            padding: 18px;
            border: 2px solid var(--premium-gold);
            background: transparent;
            color: var(--premium-gold);
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 4px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.4s;
        }

        .pulse-btn:hover {
            background: var(--premium-gold);
            color: black;
            box-shadow: 0 0 25px var(--premium-gold);
        }

        #main-ui {
            display: none;
            opacity: 0;
            transition: 2s;
        }

        .title-badge {
            display: inline-block;
            padding: 10px 22px;
            border-radius: 30px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--premium-gold);
            margin-bottom: 25px;
            letter-spacing: 3px;
            font-size: 0.8rem;
            text-transform: uppercase;
            background: rgba(212, 175, 55, 0.08);
        }

        h1 {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 40px;
        }

        h1 span {
            color: var(--neon-pink);
            text-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
        }

        .photo-deck {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .luxury-frame {
            background: var(--card-rgba);
            padding: 14px;
            border-radius: 22px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: 0.5s;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .luxury-frame:hover {
            transform: translateY(-10px) scale(1.04);
            border-color: var(--neon-pink);
            box-shadow: 0 20px 50px rgba(255, 0, 127, 0.25);
        }

        .luxury-frame img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 16px;
        }

        .message-card {
            background: linear-gradient(135deg,
                    rgba(20, 20, 25, 0.9),
                    rgba(10, 10, 12, 0.95));
            border-radius: 30px;
            padding: 45px;
            text-align: left;
            border: 1px solid rgba(255, 0, 127, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .rx-title {
            color: var(--premium-gold);
            font-size: 0.85rem;
            letter-spacing: 3px;
            margin-bottom: 25px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
            padding-bottom: 12px;
            text-transform: uppercase;
        }

        .typed-message {
            font-size: 1.1rem;
            line-height: 2;
            color: #d1d5db;
            white-space: pre-line;
        }

        .music-bar {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: rgba(20, 20, 25, 0.9);
            border: 1px solid var(--neon-pink);
            padding: 12px 18px;
            border-radius: 30px;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 999;
        }

        .sound-wave {
            display: flex;
            gap: 3px;
            align-items: end;
            height: 14px;
        }

        .sound-wave span {
            width: 2px;
            background: var(--neon-pink);
            animation: jump 0.8s infinite alternate;
        }

        .sound-wave span:nth-child(1) {
            height: 5px;
        }

        .sound-wave span:nth-child(2) {
            height: 10px;
        }

        .sound-wave span:nth-child(3) {
            height: 14px;
        }

        @keyframes jump {
            from {
                transform: scaleY(0.5);
            }

            to {
                transform: scaleY(1.2);
            }
        }

        .particle {
            position: fixed;
            bottom: -50px;
            pointer-events: none;
            animation: floatUp linear forwards;
            z-index: 999;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh) translateX(var(--drift));
                opacity: 0;
            }
        }

        @media(max-width:600px) {
            h1 {
                font-size: 2.5rem;
            }

            .message-card {
                padding: 28px;
            }
        }
    </style>
</head>

<body>

    <audio id="bday-track" loop>
        <source src="bg-music.mp3" type="audio/mp3">
    </audio>

    <div class="stars-grid"></div>
    <div class="ambient-glow"></div>

    <div class="container">

        <!-- LOADER SCREEN -->

        <div id="loader-screen">

            <div class="status-line">
                &gt; HEYY DOCTREE 👩‍⚕️✨
            </div>

            <div class="status-line">
                &gt; ARE YOU READY TO SEE A SMALL SURPRISE MESSAGE?
            </div>

            <div class="status-line">
                &gt; SPECIAL MESSAGE FROM:
                <span>RahulKumar🙂</span>
            </div>

            <div class="status-line">
                &gt; STATUS:
                <span>READY ✨</span>
            </div>

            <button class="pulse-btn"
                onclick="engageGrandReveal()">
                CLICK TO OPEN 🎈
            </button>

        </div>

        <!-- MAIN UI -->

        <div id="main-ui">

            <div class="title-badge">
                ✨ Made Especially For You ✨
            </div>

            <h1>
                Happy Birthday,
                <span>Rakshita!</span>
            </h1>

            <!-- PHOTOS -->

            <div class="photo-deck">

                <div class="luxury-frame">
                    <img src="pic1.jpg">
                </div>

                <div class="luxury-frame">
                    <img src="pic2.jpg">
                </div>

                <div class="luxury-frame">
                    <img src="pic3.jpg">
                </div>

                <div class="luxury-frame">
                    <img src="pic4.jpg">
                </div>

            </div>

            <!-- MESSAGE -->

            <div class="message-card">

                <div class="rx-title">
                    FOR RAKSHITA • HAPPY BIRTHDAY 🎈
                </div>

                <p class="typed-message"
                    id="msg-text"></p>

            </div>

        </div>

    </div>

    <!-- MUSIC BAR -->

    <div class="music-bar"
        id="audio-widget">

        <div class="sound-wave">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div>BGM ACTIVE</div>

    </div>

    <script>

        const friendshipMessage =
            `Happy Birthday, Rakshita! ✨🎂

Wishing you a really beautiful day filled with happiness, smiles, peace, and lots of good memories. 🎈

Even though we don’t talk every day, I’m genuinely happy that we met during our 11th class days. Some people may not stay in daily conversations, but they still remain special in a different way.

I hope this new year of your life brings success, positivity, confidence, and everything you truly deserve. May all your dreams slowly turn into reality and may life always give you reasons to smile.

And honestly...

Maybe I’m not that special in your story,
but in my story, you’ll always be special. ✨

Keep smiling and enjoy your special day to the fullest.

Once again,
Happy Birthday, Rakshita! 🎉

— RK 🙂`;

        function engageGrandReveal() {

            const loader =
                document.getElementById('loader-screen');

            const mainContent =
                document.getElementById('main-ui');

            const audioTrack =
                document.getElementById('bday-track');

            const audioWidget =
                document.getElementById('audio-widget');

            audioTrack.play();

            audioWidget.style.display = 'flex';

            loader.style.transform =
                'scale(0.8) translateY(-80px)';

            loader.style.opacity = '0';

            setTimeout(() => {

                loader.style.display = 'none';

                mainContent.style.display = 'block';

                setTimeout(() => {

                    mainContent.style.opacity = '1';

                    typeWriter(
                        friendshipMessage,
                        'msg-text',
                        28
                    );

                    launchPremiumDecorations();

                }, 100);

            }, 800);
        }

        let charIndex = 0;

        function typeWriter(text, elementId, speed) {

            if (charIndex < text.length) {

                document.getElementById(elementId)
                    .innerHTML += text.charAt(charIndex);

                charIndex++;

                setTimeout(() => {

                    typeWriter(text, elementId, speed);

                }, speed);
            }
        }

        function launchPremiumDecorations() {

            const items =
                ['🎈', '✨', '🎉', '💖', '⭐'];

            setInterval(() => {

                const element =
                    document.createElement('div');

                element.classList.add('particle');

                element.innerText =
                    items[Math.floor(Math.random() * items.length)];

                element.style.left =
                    Math.random() * 100 + 'vw';

                element.style.fontSize =
                    Math.random() * 2 + 1 + 'rem';

                element.style.animationDuration =
                    Math.random() * 4 + 4 + 's';

                element.style.setProperty(
                    '--drift',
                    (Math.random() * 200 - 100) + 'px'
                );

                document.body.appendChild(element);

                setTimeout(() => {
                    element.remove();
                }, 8000);

            }, 250);
        }

    </script>

</body>

</html>
